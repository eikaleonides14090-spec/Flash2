
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYBER NIGHT</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#010301;color:#00ff66;
 font-family:monospace;overflow:hidden;
}
header{
 padding:18px;border-bottom:1px solid #00ff66;
 background:#020a04;box-shadow:0 0 20px #00ff66;
}
h1{
 margin:0;letter-spacing:4px;
 text-shadow:0 0 15px #00ff66;
 animation:flicker 2s infinite;
}
.tag{font-size:11px;color:#ff3333;margin-top:8px}
#terminal{
 height:70vh;overflow:hidden;padding:12px;
 font-size:12px;line-height:1.7;
 overflow-wrap:anywhere;
}
.line{animation:appear .1s}
.red{color:#ff2929;text-shadow:0 0 8px red}
.blue{color:#00d9ff}.glitch{
 animation: screenGlitch .12s infinite;
 filter:hue-rotate(90deg);
}
@keyframes screenGlitch{
 0%{transform:translate(0)}
 20%{transform:translate(-5px,2px)}
 40%{transform:translate(5px,-2px)}
 60%{transform:translate(-3px,3px)}
 80%{transform:translate(3px,-3px)}
 100%{transform:translate(0)}
 }
@keyframes appear{
 from{opacity:0;transform:translateX(-7px)}
 to{opacity:1;transform:translateX(0)}
}
@keyframes flicker{
 0%,90%,100%{opacity:1}
 92%{opacity:.3}
 95%{opacity:.8}
}
#ending{
 display:none;position:fixed;inset:0;z-index:10;
 background:#010301;align-items:center;
 justify-content:center;flex-direction:column;
 text-align:center;padding:20px;
 animation:appear .5s;
}
#ending h2{
 color:#00ff66;font-size:27px;
 text-shadow:0 0 18px #00ff66;
 animation:flicker 1.5s infinite;
}
#ending h3{
 color:#00ff66;font-size:19px;
 text-shadow:0 0 12px #00ff66;
}
#ending p{color:#00d9ff;font-size:12px}
</style>
</head>
<body>

<header>
<h1>CYBER NIGHT</h1>
<div class="tag">SIMULATION MODE — VISUAL EFFECTS</div>
</header>

<div id="terminal"></div>

<div id="ending">
<h2>تم اختراقك بنجاح 😈😅</h2>
<h3>YOU HAVE BEEN HACKED SUCCESSFULLY 😈😅</h3>
<p>CYBER NIGHT</p>
</div>

<script>
const terminal=document.getElementById("terminal");
const ending=document.getElementById("ending");

const messages=[
"Initializing cyber interface...",
"Loading virtual security modules...",
"Scanning imaginary network...",
"Analyzing simulated system...",
"Generating encrypted visual packets...",
"Checking fictional firewall...",
"Virtual access sequence started...",
"Loading cinematic effects...",
"Testing imaginary connection...",
"SIMULATION MODE ACTIVE",
"Warning: virtual activity detected!",
"Running visual protocol...",
"Decrypting simulated signals...",
"Synchronizing virtual nodes...",
"Fictional security test running...",
"Generating random system activity...",
"Access sequence continuing...",
"Analyzing virtual response...",
"Loading next sequence...",
"Cyber interface online..."
];

let total=0;
const MAX=300;

function addLine(){
 if(total>=MAX){
  document.body.classList.add("glitch");
setTimeout(()=>{
 ending.style.display="flex";
 document.body.classList.remove("glitch");
},1800);
return;;
  return;
 }

 total++;
 const line=document.createElement("div");
 line.className="line";

 line.textContent="> "+messages[
  Math.floor(Math.random()*messages.length)
 ];

 if(total%11===0)line.classList.add("red");
 else if(total%5===0)line.classList.add("blue");

 terminal.appendChild(line);

 while(terminal.children.length>35){
  terminal.removeChild(terminal.firstChild);
 }

 setTimeout(addLine,1);
}

setTimeout(addLine,50);
</script>
</body>
</html>
