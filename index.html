
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK ACCESS 300</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#020602;color:#00ff66;
  font-family:monospace;padding:18px;
}
header{
  border-bottom:1px solid #00ff66;
  padding-bottom:12px;margin-bottom:12px;
}
h2{font-size:21px;text-shadow:0 0 12px #00ff66}
.tag{color:#ffcc00;font-size:12px}
#status{color:#00ccff;margin:12px 0}
#terminal{
  height:60vh;overflow:hidden;
  border:1px solid #075b25;padding:12px;
  background:#000;font-size:13px;
  line-height:1.7;overflow-wrap:anywhere;
}
.line{animation:appear .15s ease}
@keyframes appear{
 from{opacity:0;transform:translateX(-8px)}
 to{opacity:1;transform:translateX(0)}
}
#progress{
 height:7px;background:#123;margin-top:15px;
}
#bar{height:100%;width:0;background:#00ff66}
#count{margin-top:10px;color:#fff}
#ending{
 display:none;text-align:center;margin-top:25px;
 color:#fff;font-family:Arial,sans-serif;
}
#ending h1{color:#00ff66}
</style>
</head>
<body>
<header>
<h2>⚡ DARK ACCESS 300</h2>
<div class="tag">SIMULATION MODE — PRANK ONLY</div>
</header>

<div id="status">INITIALIZING VISUAL SIMULATION...</div>
<div id="terminal"></div>
<div id="progress"><div id="bar"></div></div>
<div id="count">0 / 300</div>

<div id="ending">
<h1>😂 اتعمل فيك مقلب يا أسطورة!</h1>
<p>ولا جهاز اتخترق ولا أي بيانات اتجمعت.</p>
<h2>SIMULATION COMPLETE</h2>
</div>

<script>
const terminal=document.getElementById("terminal");
const bar=document.getElementById("bar");
const count=document.getElementById("count");
const status=document.getElementById("status");

const messages=[
"Starting visual simulation...",
"Loading fictional security interface...",
"Scanning imaginary network...",
"Checking virtual connection...",
"Analyzing fictional system...",
"Generating simulation data...",
"Virtual access sequence started...",
"Encrypting imaginary packets...",
"Testing fictional firewall...",
"Running visual security protocol...",
"SIMULATION MODE ACTIVE"
];

let current=0;

function addLine(){
 if(current>=300){
   status.textContent="SIMULATION FINISHED";
   document.getElementById("ending").style.display="block";
   return;
 }

 current++;
 let line=document.createElement("div");
 line.className="line";
 let msg=messages[Math.floor(Math.random()*messages.length)];
 line.textContent="["+String(current).padStart(3,"0")+"] "+msg;
 terminal.appendChild(line);

 while(terminal.children.length>35){
   terminal.removeChild(terminal.firstChild);
 }

 bar.style.width=(current/300*100)+"%";
 count.textContent=current+" / 300";

 let speed=Math.max(20,150-current*0.4);
 setTimeout(addLine,speed);
}

setTimeout(()=>{
 status.textContent="VISUAL SEQUENCE RUNNING...";
 addLine();
},700);
</script>
</body>
</html>
